name: Build Windows ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    steps:
    - name: Configure Git Longpaths
      run: git config --global core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install NASM
      run: choco install nasm -y

    - name: Add NASM to PATH
      run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Restore Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-windows-arm64-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-windows-arm64-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-
          ${{ runner.os }}-windows-arm64-toolchain-

    - name: Build Windows ARM64 SDK
      run: |
        cmake -B Build -A ARM64 `
          -DBUILD_TEAMTALK_CORE=ON `
          -DBUILD_TEAMTALK_STATIC=ON `
          -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON `
          -DWEBRTC=ON `
          -DFEATURE_WEBRTC=ON `
          -DFEATURE_OPUSTOOLS=ON `
          -DFFMPEG=ON `
          -DOPUS=ON `
          -DSPEEX=ON `
          -DSPEEXDSP=ON `
          -DLIBVPX=ON `
          -DOGG=ON `
          -DDSHOW=ON `
          -DVIDCAP=ON `
          -DLAMEMP3=ON `
          -DBUILD_TEAMTALK5DLL=ON `
          -DBUILD_TEAMTALK5PRODLL=OFF `
          -DBUILD_TEAMTALK5LIB=OFF `
          -DBUILD_TEAMTALK5PROLIB=OFF `
          -DBUILD_TT5SRV=OFF `
          -DBUILD_TT5PROSRV=OFF `
          -DCATCH_UNITTEST=OFF
        
        cmake --build Build --config Release --target TeamTalk5DLL

    - name: Prepare architecture-specific artifact
      run: |
        Copy-Item Library/TeamTalk_DLL/Release/TeamTalk5.dll Library/TeamTalk_DLL/Release/TeamTalk5-windows-arm64.dll

    - name: Upload TeamTalk5-windows-arm64.dll Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TeamTalk5-windows-arm64
        path: Library/TeamTalk_DLL/Release/TeamTalk5-windows-arm64.dll

    - name: Save Cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-windows-arm64-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
