name: Build Windows x64 SDK (v5.8.1)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up vcpkg
      run: |
        vcpkg integrate install

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install --triplet x64-windows openssl opus speex speexdsp libvpx portaudio tinyxml ace[ssl,wchar] libogg zlib

    - name: Map vcpkg libraries to TeamTalk toolchain structure
      shell: pwsh
      run: |
        $vcpkg = "C:/vcpkg/installed/x64-windows"
        $tc = "Library/TeamTalkLib/toolchain"
        
        Write-Host "=== VCPKG LIB CONTENTS ==="
        Get-ChildItem -Path "$vcpkg/lib" | Select-Object Name
        Write-Host "=== VCPKG DEBUG LIB CONTENTS ==="
        Get-ChildItem -Path "$vcpkg/debug/lib" | Select-Object Name
        
        New-Item -ItemType Directory -Force -Path "$tc/opus/include"
        New-Item -ItemType Directory -Force -Path "$tc/opus/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/opus/*" "$tc/opus/include"
        Copy-Item "$vcpkg/lib/opus.lib" "$tc/opus/lib/x64/opus.lib"
        Copy-Item "$vcpkg/debug/lib/opus.lib" "$tc/opus/lib/x64/opusd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/speex/include"
        New-Item -ItemType Directory -Force -Path "$tc/speex/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/speex" "$tc/speex/include"
        Copy-Item "$vcpkg/lib/speex.lib" "$tc/speex/lib/x64/libspeex_sse2.lib"
        Copy-Item "$vcpkg/debug/lib/speex.lib" "$tc/speex/lib/x64/libspeexd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/speexdsp/include"
        New-Item -ItemType Directory -Force -Path "$tc/speexdsp/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/speex" "$tc/speexdsp/include"
        Copy-Item "$vcpkg/lib/speexdsp.lib" "$tc/speexdsp/lib/x64/libspeexdsp.lib"
        Copy-Item "$vcpkg/lib/speexdsp.lib" "$tc/speexdsp/lib/x64/libspeexdsp_sse.lib"
        Copy-Item "$vcpkg/debug/lib/speexdsp.lib" "$tc/speexdsp/lib/x64/libspeexdspd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/zlib/include"
        New-Item -ItemType Directory -Force -Path "$tc/zlib/lib/x64"
        Copy-Item "$vcpkg/include/zlib.h" "$tc/zlib"
        Copy-Item "$vcpkg/include/zconf.h" "$tc/zlib"
        Copy-Item "$vcpkg/include/zlib.h" "$tc/zlib/include"
        Copy-Item "$vcpkg/include/zconf.h" "$tc/zlib/include"
        Copy-Item "$vcpkg/lib/zlib*.lib" "$tc/zlib/lib/x64/zlib.lib"
        Copy-Item "$vcpkg/debug/lib/zlib*.lib" "$tc/zlib/lib/x64/zlibd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/ogg/include"
        New-Item -ItemType Directory -Force -Path "$tc/ogg/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/ogg" "$tc/ogg/include"
        Copy-Item "$vcpkg/lib/ogg.lib" "$tc/ogg/lib/x64/ogg.lib"
        Copy-Item "$vcpkg/lib/ogg.lib" "$tc/ogg/lib/x64/libogg.lib"
        Copy-Item "$vcpkg/debug/lib/ogg.lib" "$tc/ogg/lib/x64/oggd.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/debug/lib/ogg.lib" "$tc/ogg/lib/x64/liboggd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/libvpx/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/vpx" "$tc/libvpx"
        Copy-Item "$vcpkg/lib/vpx.lib" "$tc/libvpx/lib/x64/vpxmt.lib"
        Copy-Item "$vcpkg/debug/lib/vpx.lib" "$tc/libvpx/lib/x64/vpxmtd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/tinyxml/include"
        New-Item -ItemType Directory -Force -Path "$tc/tinyxml/lib/x64"
        Copy-Item "$vcpkg/include/tinyxml*" "$tc/tinyxml"
        Copy-Item "$vcpkg/include/tinyxml*" "$tc/tinyxml/include"
        Copy-Item "$vcpkg/lib/tinyxml.lib" "$tc/tinyxml/lib/x64/tinyxml.lib"
        Copy-Item "$vcpkg/debug/lib/tinyxml.lib" "$tc/tinyxml/lib/x64/tinyxmld.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/portaudio/include"
        New-Item -ItemType Directory -Force -Path "$tc/portaudio/lib/x64"
        Copy-Item "$vcpkg/include/portaudio.h" "$tc/portaudio/include"
        Copy-Item "$vcpkg/include/pa_*.h" "$tc/portaudio/include" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/lib/portaudio.lib" "$tc/portaudio/lib/x64/portaudio.lib"
        Copy-Item "$vcpkg/debug/lib/portaudio.lib" "$tc/portaudio/lib/x64/portaudiod.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/ACE/ACE/lib/x64"
        Copy-Item -Recurse "$vcpkg/include/ace" "$tc/ACE/ACE"
        Copy-Item "$vcpkg/lib/ACE.lib" "$tc/ACE/ACE/lib/x64/ACEs.lib"
        Copy-Item "$vcpkg/lib/ACE_SSL.lib" "$tc/ACE/ACE/lib/x64/ACE_SSLs.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/lib/ACE_INet.lib" "$tc/ACE/ACE/lib/x64/ACE_INets.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/lib/ACE_INet_SSL.lib" "$tc/ACE/ACE/lib/x64/ACE_INet_SSLs.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/debug/lib/ACE.lib" "$tc/ACE/ACE/lib/x64/ACEsd.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/debug/lib/ACE_SSL.lib" "$tc/ACE/ACE/lib/x64/ACE_SSLsd.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/debug/lib/ACE_INet.lib" "$tc/ACE/ACE/lib/x64/ACE_INetsd.lib" -ErrorAction SilentlyContinue
        Copy-Item "$vcpkg/debug/lib/ACE_INet_SSL.lib" "$tc/ACE/ACE/lib/x64/ACE_INet_SSLsd.lib" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path "$tc/openssl/include"
        Copy-Item -Recurse "$vcpkg/include/openssl" "$tc/openssl/include"
        Copy-Item "$vcpkg/lib/libssl.lib" "$tc/openssl/libssl.lib"
        Copy-Item "$vcpkg/lib/libcrypto.lib" "$tc/openssl/libcrypto.lib"

    - name: Configure CMake
      run: |
        cmake -S . -B build_win -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCMAKE_CXX_STANDARD=17 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DBUILD_TEAMTALK_CORE=ON `
          -DWEBRTC=OFF `
          -DBUILD_TEAMTALK_STATIC=OFF `
          -DBUILD_TEAMTALK_ACE=OFF `
          -DBUILD_TEAMTALKPRO_SERVERS=OFF `
          -DBUILD_TEAMTALK_CLIENTS=OFF `
          -DBUILD_TEAMTALK_LIBRARIES=OFF `
          -DBUILD_TEAMTALK5DLL=ON `
          -DBUILD_TEAMTALK5PRODLL=OFF `
          -DBUILD_TEAMTALK5LIB=OFF `
          -DBUILD_TEAMTALK5PROLIB=OFF

    - name: Build SDK (Release)
      run: |
        cmake --build build_win --config Release --target TeamTalk5DLL

    - name: Upload Windows x64 DLL Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-windows-x64
        path: |
          Library/TeamTalk_DLL/Release/TeamTalk5.dll
          Library/TeamTalk_DLL/Release/TeamTalk5.lib
