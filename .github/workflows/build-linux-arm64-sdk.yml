name: Build Linux ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:20.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      shell: bash
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          cmake \
          g++ \
          gcc \
          git \
          make \
          ninja-build \
          perl \
          pkg-config \
          libasound2-dev \
          libpulse-dev \
          libxss-dev \
          libglib2.0-dev \
          libpcap-dev \
          libspeechd-dev

    - name: Build ARM64 SDK (.so)
      shell: bash
      run: |
        export PYTHONPATH=""
        cmake -B Build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TEAMTALK_CORE=ON \
          -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON \
          -DWEBRTC=OFF \
          -DFEATURE_WEBRTC=OFF \
          -DBUILD_TEAMTALK_LIBRARY_DLL=ON \
          -DBUILD_TEAMTALK_SERVER_SRVEXE=OFF \
          -DBUILD_TEAMTALK_SERVER_SRVEXEPRO=OFF \
          -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF
        
        cmake --build Build --target TeamTalk5DLL

    - name: Prepare architecture-specific artifact
      shell: bash
      run: |
        cp Library/TeamTalk_DLL/libTeamTalk5.so Library/TeamTalk_DLL/libTeamTalk5-linux-arm64.so

    - name: Upload libTeamTalk5-linux-arm64.so Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-linux-arm64
        path: Library/TeamTalk_DLL/libTeamTalk5-linux-arm64.so
