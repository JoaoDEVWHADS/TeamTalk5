name: Build Linux ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build ARM64 SDK (.so)
      uses: uraimo/run-on-arch-action@v3
      with:
        arch: aarch64
        distro: ubuntu24.04
        githubToken: ${{ github.token }}
        
        # Install build dependencies for TeamTalk 5 (using system libraries instead of toolchain)
        install: |
          apt-get update
          apt-get install -y \
            cmake \
            g++ \
            git \
            libasound2-dev \
            libglib2.0-dev \
            libpcap-dev \
            libpulse-dev \
            libspeechd-dev \
            libssl-dev \
            libtool \
            libxss-dev \
            ninja-build \
            pkg-config \
            libopus-dev \
            libspeex-dev \
            libspeexdsp-dev \
            libvpx-dev \
            libace-dev \
            libtinyxml-dev \
            libogg-dev \
            zlib1g-dev

        # Compile libTeamTalk5.so using system shared libraries
        run: |
          cd /github/workspace
          source env.sh
          make CMAKE_EXTRA="-DWEBRTC=OFF -DBUILD_TEAMTALK_STATIC=OFF -DTINYXML_STATIC=OFF -DSPEEX_STATIC=OFF -DLIBVPX_STATIC=OFF -DACE_STATIC=OFF -DOGG_STATIC=OFF -DOPUS_STATIC=OFF -DZLIB_STATIC=OFF -DFFMPEG_STATIC=OFF -DPORTAUDIO_STATIC=OFF -DSPEEXDSP_STATIC=OFF -DBUILD_TEAMTALK_SERVERS=OFF -DBUILD_TEAMTALK_SERVER_SRVEXE=OFF -DBUILD_TEAMTALK_SERVER_SRVEXEPRO=OFF -DBUILD_TEAMTALK_CLIENTS=OFF -DBUILD_TEAMTALK_LIBRARIES=ON -DBUILD_TEAMTALK5DLL=ON -DBUILD_TEAMTALK5PRODLL=OFF -DBUILD_TEAMTALK5LIB=OFF -DBUILD_TEAMTALK5PROLIB=OFF" -C Build ubuntu64

    - name: Upload libTeamTalk5.so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libTeamTalk5-linux-arm64
        path: Library/TeamTalk_DLL/libTeamTalk5.so
