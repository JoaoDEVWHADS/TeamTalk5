name: Build Linux ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build ARM64 SDK (.so)
      uses: uraimo/run-on-arch-action@v3
      with:
        arch: aarch64
        distro: ubuntu20.04
        githubToken: ${{ github.token }}
        
        # Install build dependencies for TeamTalk 5 (using system libraries instead of toolchain)
        install: |
          apt-get update
          apt-get install -y \
            cmake \
            g++ \
            git \
            libasound2-dev \
            libglib2.0-dev \
            libpcap-dev \
            libpulse-dev \
            libspeechd-dev \
            libssl-dev \
            libtool \
            libxss-dev \
            ninja-build \
            pkg-config \
            libopus-dev \
            libspeex-dev \
            libspeexdsp-dev \
            libvpx-dev \
            libace-dev \
            libace-inet-dev \
            libace-inet-ssl-dev \
            libtinyxml-dev \
            libogg-dev \
            zlib1g-dev \
            portaudio19-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev

        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p sys_libs/ACE/lib
          ln -s /usr/lib/aarch64-linux-gnu/libACE.a sys_libs/ACE/lib/libACE.a
          ln -s /usr/lib/aarch64-linux-gnu/libACE_INet.a sys_libs/ACE/lib/libACE_INet.a
          ln -s /usr/lib/aarch64-linux-gnu/libACE_SSL.a sys_libs/ACE/lib/libACE_SSL.a
          ln -s /usr/lib/aarch64-linux-gnu/libACE_INet_SSL.a sys_libs/ACE/lib/libACE_INet_SSL.a
          ln -s /usr/include sys_libs/ACE/include
          export PYTHONPATH=""
          source env.sh
          make CMAKE_EXTRA="-DWEBRTC=OFF -DBUILD_TEAMTALK_STATIC=OFF -DBUILD_TEAMTALK_ACE=OFF -DTINYXML_STATIC=OFF -DSPEEX_STATIC=OFF -DLIBVPX_STATIC=OFF -DACE_STATIC=ON -DTTLIBS_ROOT=$GITHUB_WORKSPACE/sys_libs -DOGG_STATIC=OFF -DOPUS_STATIC=OFF -DZLIB_STATIC=OFF -DFFMPEG_STATIC=OFF -DPORTAUDIO_STATIC=OFF -DSPEEXDSP_STATIC=OFF -DOPUSTOOLS=OFF -DBUILD_TEAMTALKPRO_SERVERS=OFF -DBUILD_TEAMTALK_CLIENTS=OFF -DBUILD_TEAMTALK_LIBRARIES=OFF -DBUILD_TEAMTALK5DLL=ON -DBUILD_TEAMTALK5PRODLL=OFF -DBUILD_TEAMTALK5LIB=OFF -DBUILD_TEAMTALK5PROLIB=OFF" -C Build ubuntu64 > build.log 2>&1 || (tail -n 200 build.log && exit 1)

    - name: Upload libTeamTalk5.so Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-linux-arm64
        path: Library/TeamTalk_DLL/libTeamTalk5.so

    - name: Upload Build Log (On Failure)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compile-build-log
        path: build.log
