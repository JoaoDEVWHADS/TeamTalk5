name: Build Linux ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04
    steps:
    - name: Install git inside container
      run: |
        apt-get update
        apt-get install -y git
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      shell: bash
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          cmake \
          g++-12 \
          gcc-12 \
          git \
          make \
          ninja-build \
          perl \
          pkg-config \
          libasound2-dev \
          libpulse-dev \
          libxss-dev \
          libglib2.0-dev \
          libpcap-dev \
          libspeechd-dev \
          libssl-dev \
          libtool \
          yasm \
          nasm \
          curl \
          wget
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12
        # Link aarch64-linux-gnu-g++ to g++-12 since the build runs natively on ARM64 and WebRTC expects this binary
        ln -sf /usr/bin/gcc-12 /usr/bin/aarch64-linux-gnu-gcc
        ln -sf /usr/bin/g++-12 /usr/bin/aarch64-linux-gnu-g++

    - name: Restore Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-
          ${{ runner.os }}-toolchain-

    - name: Build ARM64 SDK (.so)
      run: |
        export PYTHONPATH=""
        cmake -B Build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TEAMTALK_CORE=ON \
          -DBUILD_TEAMTALK_STATIC=ON \
          -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON \
          -DWEBRTC=ON \
          -DFEATURE_WEBRTC=ON \
          -DFEATURE_OPUSTOOLS=ON \
          -DFFMPEG=ON \
          -DOPUS=ON \
          -DSPEEX=ON \
          -DSPEEXDSP=ON \
          -DLIBVPX=ON \
          -DOGG=ON \
          -DDSHOW=ON \
          -DVIDCAP=ON \
          -DLAMEMP3=ON \
          -DBUILD_TEAMTALK5DLL=ON \
          -DBUILD_TEAMTALK5PRODLL=OFF \
          -DBUILD_TEAMTALK5LIB=OFF \
          -DBUILD_TEAMTALK5PROLIB=OFF \
          -DBUILD_TT5SRV=OFF \
          -DBUILD_TT5PROSRV=OFF \
          -DCATCH_UNITTEST=OFF
        
        cmake --build Build --target TeamTalk5DLL

    - name: Prepare architecture-specific artifact
      shell: bash
      run: |
        cp Library/TeamTalk_DLL/libTeamTalk5.so Library/TeamTalk_DLL/libTeamTalk5-linux-arm64.so

    - name: Upload libTeamTalk5-linux-arm64.so Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-linux-arm64
        path: Library/TeamTalk_DLL/libTeamTalk5-linux-arm64.so

    - name: Save Cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
