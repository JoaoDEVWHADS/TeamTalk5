name: Build Linux ARM64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache static ACE and dependencies
      id: cache-dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/ttlibs
        key: ${{ runner.os }}-static-libs-v5-arm64

    - name: Build inside Ubuntu 20.04 Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:20.04 bash -c "
          apt-get update && \
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake \
            g++-11 \
            gcc-11 \
            git \
            wget \
            libasound2-dev \
            libglib2.0-dev \
            libpcap-dev \
            libpulse-dev \
            libspeechd-dev \
            libssl-dev \
            libtool \
            libxss-dev \
            ninja-build \
            pkg-config \
            libopus-dev \
            libspeex-dev \
            libspeexdsp-dev \
            libvpx-dev \
            libace-dev \
            libace-inet-dev \
            libace-inet-ssl-dev \
            libtinyxml-dev \
            libogg-dev \
            zlib1g-dev \
            portaudio19-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev && \
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100 --slave /usr/bin/g++ g++ /usr/bin/g++-11 && \
          rm -f /usr/bin/aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-g++ && \
          ln -sf /usr/bin/gcc-11 /usr/bin/aarch64-linux-gnu-gcc && \
          ln -sf /usr/bin/g++-11 /usr/bin/aarch64-linux-gnu-g++ && \
          export CC=gcc-11 && \
          export CXX=g++-11 && \
          
          # 1. Download and extract ACE 6.5.12 if not cached
          if [ ! -d \"/workspace/ttlibs/ACE/lib\" ]; then \
            echo '=== Cache miss: Downloading and building static ACE ===' && \
            cd /tmp && \
            wget -q https://github.com/DOCGroup/ACE_TAO/releases/download/ACE%2BTAO-6_5_12/ACE-6.5.12.tar.gz && \
            tar -xf ACE-6.5.12.tar.gz && \
            cd ACE_wrappers && \
            export ACE_ROOT=\$(pwd) && \
            echo '#include \"ace/config-linux.h\"' > ace/config.h && \
            echo 'include \$(ACE_ROOT)/include/makeinclude/platform_linux.GNU' > include/makeinclude/platform_macros.GNU && \
            echo 'shared_libs = 0' >> include/makeinclude/platform_macros.GNU && \
            echo 'static_libs = 1' >> include/makeinclude/platform_macros.GNU && \
            echo 'ssl = 1' >> include/makeinclude/platform_macros.GNU && \
            
            # Build only the components we need
            cd \$ACE_ROOT/ace && make -j\$(nproc) && \
            cd \$ACE_ROOT/ace/SSL && make -j\$(nproc) && \
            cd \$ACE_ROOT/protocols/ace/INet && \
            make -f GNUmakefile.INet -j\$(nproc) && \
            make -f GNUmakefile.INet_SSL -j\$(nproc) && \
            
            # Create the TTLIBS structure in the shared workspace
            mkdir -p /workspace/ttlibs/ACE/lib && \
            mkdir -p /workspace/ttlibs/ACE/include && \
            cp -r \$ACE_ROOT/ace /workspace/ttlibs/ACE/include/ && \
            cp -r \$ACE_ROOT/protocols /workspace/ttlibs/ACE/include/ && \
            cp \$ACE_ROOT/lib/*.a /workspace/ttlibs/ACE/lib/ && \
            
            # Copy other system static libraries and headers into TTLIBS structure
            echo '=== Populating system static libraries in TTLIBS ===' && \
            # TinyXML
            mkdir -p /workspace/ttlibs/tinyxml && \
            cp /usr/lib/aarch64-linux-gnu/libtinyxml.a /workspace/ttlibs/tinyxml/libTinyXML.a && \
            cp /usr/include/tinyxml.h /workspace/ttlibs/tinyxml/ && \
            
            # Speex and SpeexDSP
            mkdir -p /workspace/ttlibs/speex/lib /workspace/ttlibs/speex/include/speex && \
            cp /usr/lib/aarch64-linux-gnu/libspeex.a /workspace/ttlibs/speex/lib/ && \
            cp /usr/lib/aarch64-linux-gnu/libspeexdsp.a /workspace/ttlibs/speex/lib/ && \
            cp -r /usr/include/speex/* /workspace/ttlibs/speex/include/speex/ && \
            
            # Ogg
            mkdir -p /workspace/ttlibs/ogg/lib /workspace/ttlibs/ogg/include/ogg && \
            cp /usr/lib/aarch64-linux-gnu/libogg.a /workspace/ttlibs/ogg/lib/ && \
            cp -r /usr/include/ogg/* /workspace/ttlibs/ogg/include/ogg/ && \
            
            # Opus
            mkdir -p /workspace/ttlibs/opus/lib /workspace/ttlibs/opus/include/opus && \
            cp /usr/lib/aarch64-linux-gnu/libopus.a /workspace/ttlibs/opus/lib/ && \
            cp -r /usr/include/opus/* /workspace/ttlibs/opus/include/opus/ && \
            
            # Zlib
            mkdir -p /workspace/ttlibs/zlib/lib /workspace/ttlibs/zlib/include && \
            cp /usr/lib/aarch64-linux-gnu/libz.a /workspace/ttlibs/zlib/lib/ && \
            cp /usr/include/zlib.h /usr/include/zconf.h /workspace/ttlibs/zlib/include/ && \
            
            # Libvpx
            mkdir -p /workspace/ttlibs/libvpx/lib /workspace/ttlibs/libvpx/include/vpx && \
            cp /usr/lib/aarch64-linux-gnu/libvpx.a /workspace/ttlibs/libvpx/lib/ && \
            cp -r /usr/include/vpx/* /workspace/ttlibs/libvpx/include/vpx/ && \
            
            # PortAudio
            mkdir -p /workspace/ttlibs/portaudio/lib /workspace/ttlibs/portaudio/include && \
            cp /usr/lib/aarch64-linux-gnu/libportaudio.a /workspace/ttlibs/portaudio/lib/ && \
            cp /usr/include/portaudio.h /workspace/ttlibs/portaudio/include/ ; \
          else \
            echo '=== Cache hit: Using cached static ACE & system libraries ===' ; \
          fi && \
          
          # 2. Build WebRTC if not cached
          if [ ! -f \"/workspace/ttlibs/webrtc/obj/modules/audio_processing/libteamtalk.a\" ]; then \
            echo '=== Cache miss: Downloading and building WebRTC ===' && \
            apt-get install -y python3 rsync curl && \
            mkdir -p /tmp/webrtc-fetch && \
            cd /tmp/webrtc-fetch && \
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /tmp/depot-tools && \
            export PATH=\$PATH:/tmp/depot-tools && \
            gclient --version && \
            fetch --nohooks webrtc && \
            cd src && \
            git checkout branch-heads/7778 && \
            gclient sync -D --force --reset --no-history -j\$(nproc) && \
            git apply /workspace/Library/TeamTalkLib/build/webrtc/0001-Add-teamtalk-static-lib.patch && \
            mkdir -p out/Release && \
            cp /workspace/Library/TeamTalkLib/build/webrtc/args.gn_linux out/Release/args.gn && \
            gn gen out/Release && \
            ninja -C out/Release teamtalk && \
            mkdir -p /workspace/ttlibs/webrtc/obj/modules/audio_processing && \
            cp out/Release/obj/modules/audio_processing/libteamtalk.a /workspace/ttlibs/webrtc/obj/modules/audio_processing/ && \
            mkdir -p /workspace/ttlibs/webrtc/include && \
            find . -type f -name \"*.h\" -exec cp --parents \{\} /workspace/ttlibs/webrtc/include/ \; && \
            find . -type f -name \"*.inc\" -exec cp -r --parents \{\} /workspace/ttlibs/webrtc/include/ \; && \
            rm -rf /tmp/webrtc-fetch /tmp/depot-tools ; \
          else \
            echo '=== Cache hit: Using cached static WebRTC ===' ; \
          fi && \
          
          # 3. Build TeamTalk 5
          echo '=== Building TeamTalk 5 ===' && \
          cd /workspace && \
          export PYTHONPATH='' && \
          source env.sh && \
          make CMAKE_EXTRA='-DWEBRTC=ON -DBUILD_TEAMTALK_STATIC=OFF -DBUILD_TEAMTALK_ACE=OFF -DTINYXML_STATIC=ON -DSPEEX_STATIC=ON -DLIBVPX_STATIC=ON -DACE_STATIC=ON -DTTLIBS_ROOT=/workspace/ttlibs -DOGG_STATIC=ON -DOPUS_STATIC=ON -DZLIB_STATIC=ON -DFFMPEG_STATIC=OFF -DPORTAUDIO_STATIC=ON -DSPEEXDSP_STATIC=ON -DOPUSTOOLS=OFF -DBUILD_TEAMTALKPRO_SERVERS=OFF -DBUILD_TEAMTALK_CLIENTS=OFF -DBUILD_TEAMTALK_LIBRARIES=OFF -DBUILD_TEAMTALK5DLL=ON -DBUILD_TEAMTALK5PRODLL=OFF -DBUILD_TEAMTALK5LIB=OFF -DBUILD_TEAMTALK5PROLIB=OFF' -C Build ubuntu64 > build.log 2>&1 || (tail -n 200 build.log && exit 1) && \
          
          # 4. Strip final .so binary
          echo '=== Stripping libTeamTalk5.so ===' && \
          strip Library/TeamTalk_DLL/libTeamTalk5.so
        "

    - name: Upload libTeamTalk5.so Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-linux-arm64
        path: Library/TeamTalk_DLL/libTeamTalk5.so

    - name: Upload Build Log (On Failure)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compile-build-log
        path: build.log
