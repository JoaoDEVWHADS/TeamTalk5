name: Build Linux x64 SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          cmake \
          curl \
          g++ \
          git \
          libasound2-dev \
          libglib2.0-dev \
          libpcap-dev \
          libpulse-dev \
          libspeechd-dev \
          libssl-dev \
          libtool \
          libxss-dev \
          ninja-build \
          pkg-config \
          libopus-dev \
          libspeex-dev \
          libspeexdsp-dev \
          libvpx-dev \
          libace-dev \
          libace-inet-dev \
          libace-inet-ssl-dev \
          libtinyxml-dev \
          libogg-dev \
          zlib1g-dev \
          portaudio19-dev \
          libavcodec-dev \
          libavdevice-dev \
          libavfilter-dev \
          libavformat-dev \
          libavutil-dev \
          libswresample-dev \
          libswscale-dev

    - name: Compile Static FFmpeg
      shell: bash
      run: |
        curl -sLO https://ffmpeg.org/releases/ffmpeg-4.2.9.tar.bz2
        tar -xf ffmpeg-4.2.9.tar.bz2
        cd ffmpeg-4.2.9
        ./configure \
          --prefix="$GITHUB_WORKSPACE/Library/TeamTalkLib/toolchain/ffmpeg" \
          --enable-static \
          --disable-shared \
          --disable-programs \
          --disable-doc \
          --enable-pic \
          --disable-yasm
        make -j$(nproc)
        make install

    - name: Compile Static Dependencies from Source
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/deps-build"
        PREFIX="$GITHUB_WORKSPACE/Library/TeamTalkLib/toolchain"
        mkdir -p "$PREFIX"

        # 1. Compile zlib
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://zlib.net/zlib-1.3.1.tar.gz
        tar -xf zlib-1.3.1.tar.gz
        cd zlib-1.3.1
        CFLAGS="-fPIC" ./configure --prefix="$PREFIX/zlib" --static
        make -j$(nproc) install

        # 2. Compile libogg
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
        tar -xf libogg-1.3.5.tar.gz
        cd libogg-1.3.5
        ./configure --prefix="$PREFIX/ogg" --enable-static --disable-shared --with-pic
        make -j$(nproc) install

        # 3. Compile Opus
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://downloads.xiph.org/releases/opus/opus-1.3.1.tar.gz
        tar -xf opus-1.3.1.tar.gz
        cd opus-1.3.1
        ./configure --prefix="$PREFIX/opus" --enable-static --disable-shared --with-pic
        make -j$(nproc) install

        # 4. Compile Speex
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://downloads.xiph.org/releases/speex/speex-1.2.0.tar.gz
        tar -xf speex-1.2.0.tar.gz
        cd speex-1.2.0
        ./configure --prefix="$PREFIX/speex" --enable-static --disable-shared --with-pic
        make -j$(nproc) install

        # 5. Compile Speexdsp
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://downloads.xiph.org/releases/speex/speexdsp-1.2.0.tar.gz
        tar -xf speexdsp-1.2.0.tar.gz
        cd speexdsp-1.2.0
        ./configure --prefix="$PREFIX/speexdsp" --enable-static --disable-shared --with-pic
        make -j$(nproc) install

        # 6. Compile libvpx
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://github.com/webmproject/libvpx/archive/refs/tags/v1.11.0.tar.gz
        tar -xf v1.11.0.tar.gz
        cd libvpx-1.11.0
        ./configure --prefix="$PREFIX/libvpx" --enable-static --disable-shared --enable-pic --disable-examples --disable-unit-tests
        make -j$(nproc) install

        # 7. Compile PortAudio
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        tar -xf pa_stable_v190700_20210406.tgz
        cd portaudio
        ./configure --prefix="$PREFIX/portaudio" --enable-static --disable-shared --with-pic
        make -j$(nproc) install

        # 8. Compile ACE (only the ace, ace/SSL, protocols/ace/INet, protocols/ace/INet/SSL libraries)
        cd "$GITHUB_WORKSPACE/deps-build"
        curl -sLO https://github.com/DOCGroup/ACE_TAO/releases/download/ACE%2BTAO-6_5_12/ACE-6.5.12.tar.gz
        tar -xf ACE-6.5.12.tar.gz
        cd ACE_wrappers
        export ACE_ROOT=$PWD
        echo '#include "ace/config-linux.h"' > ace/config.h
        echo 'include $(ACE_ROOT)/include/makeinclude/platform_linux.GNU' > include/makeinclude/platform_macros.GNU
        echo 'CFLAGS += -fPIC' >> include/makeinclude/platform_macros.GNU
        echo 'CXXFLAGS += -fPIC' >> include/makeinclude/platform_macros.GNU
        echo 'static_libs_only=1' >> include/makeinclude/platform_macros.GNU
        
        cd ace
        make -j$(nproc)
        cd SSL
        make -j$(nproc)
        cd ../../protocols/ace/INet
        make -j$(nproc)
        cd SSL
        make -j$(nproc)
        
        # Manually install/copy ACE to toolchain
        mkdir -p "$PREFIX/ACE/include/ace/SSL"
        mkdir -p "$PREFIX/ACE/include/protocols/ace/"
        mkdir -p "$PREFIX/ACE/lib"
        cp -r "$ACE_ROOT/ace" "$PREFIX/ACE/include/"
        cp -r "$ACE_ROOT/protocols/ace/INet" "$PREFIX/ACE/include/protocols/ace/"
        cp "$ACE_ROOT/lib/libACE.a" "$PREFIX/ACE/lib/"
        cp "$ACE_ROOT/lib/libACE_SSL.a" "$PREFIX/ACE/lib/"
        cp "$ACE_ROOT/lib/libACE_INet.a" "$PREFIX/ACE/lib/"
        cp "$ACE_ROOT/lib/libACE_INet_SSL.a" "$PREFIX/ACE/lib/"

    - name: Build x64 SDK (.so)
      shell: bash
      run: |
        export PYTHONPATH=""
        source env.sh
        make CMAKE_EXTRA="-DWEBRTC=OFF -DBUILD_TEAMTALK_STATIC=OFF -DBUILD_TEAMTALK_ACE=OFF -DTINYXML_STATIC=ON -DSPEEX_STATIC=ON -DLIBVPX_STATIC=ON -DACE_STATIC=ON -DOGG_STATIC=ON -DOPUS_STATIC=ON -DZLIB_STATIC=ON -DFFMPEG_STATIC=ON -DPORTAUDIO_STATIC=ON -DSPEEXDSP_STATIC=ON -DOPUSTOOLS=ON -DBUILD_TEAMTALKPRO_SERVERS=OFF -DBUILD_TEAMTALK_CLIENTS=OFF -DBUILD_TEAMTALK_LIBRARIES=OFF -DBUILD_TEAMTALK5DLL=ON -DBUILD_TEAMTALK5PRODLL=OFF -DBUILD_TEAMTALK5LIB=OFF -DBUILD_TEAMTALK5PROLIB=OFF" -C Build ubuntu64 > build.log 2>&1 || (tail -n 200 build.log && exit 1)

    - name: Strip Debug Symbols
      shell: bash
      run: |
        strip --strip-unneeded Library/TeamTalk_DLL/libTeamTalk5.so

    - name: Upload libTeamTalk5.so Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-linux-x64
        path: Library/TeamTalk_DLL/libTeamTalk5.so

    - name: Upload Build Log (On Failure)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: compile-build-log-x64
        path: build.log
