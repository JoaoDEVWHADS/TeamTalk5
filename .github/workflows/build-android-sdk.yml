name: Build Android SDK (v5.8.1)

on:
  push:
    branches: [ "v5.8.1-custom" ]
  pull_request:
    branches: [ "v5.8.1-custom" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build make perl curl wget nasm yasm

    - name: Restore Cache
      uses: actions/cache/restore@v4
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-android-${{ matrix.abi }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-android-${{ matrix.abi }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-
          ${{ runner.os }}-android-${{ matrix.abi }}-toolchain-

    - name: Build Android SDK for ${{ matrix.abi }}
      run: |
        cmake -B Build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-21 \
          -DBUILD_TEAMTALK_CORE=ON \
          -DBUILD_TEAMTALK_STATIC=ON \
          -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=ON \
          -DWEBRTC=ON \
          -DFEATURE_WEBRTC=ON \
          -DFEATURE_OPUSTOOLS=ON \
          -DFFMPEG=ON \
          -DOPUS=ON \
          -DSPEEX=ON \
          -DSPEEXDSP=ON \
          -DLIBVPX=ON \
          -DOGG=ON \
          -DDSHOW=ON \
          -DVIDCAP=ON \
          -DLAMEMP3=ON \
          -DBUILD_TEAMTALK_LIBRARIES=ON \
          -DBUILD_TEAMTALK_LIBRARY_JNI=ON \
          -DBUILD_TEAMTALK_LIBRARY_JAR=ON \
          -DBUILD_TEAMTALK5DLL=ON \
          -DBUILD_TEAMTALK5PRODLL=OFF \
          -DBUILD_TEAMTALK5LIB=OFF \
          -DBUILD_TEAMTALK5PROLIB=OFF \
          -DBUILD_TT5SRV=OFF \
          -DBUILD_TT5PROSRV=OFF \
          -DCATCH_UNITTEST=OFF
        
        cmake --build Build --target TeamTalk5DLL
        cmake --build Build --target TeamTalk5-jni

    - name: Prepare architecture-specific artifact
      run: |
        mkdir -p Library/TeamTalk_DLL/${{ matrix.abi }}
        # Copy the JNI library to our DLL directory as well
        cp Library/TeamTalkJNI/libs/${{ matrix.abi }}/libTeamTalk5-jni.so Library/TeamTalk_DLL/${{ matrix.abi }}/

    - name: Upload libTeamTalk5.so Artifact for ${{ matrix.abi }}
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libTeamTalk5-android-${{ matrix.abi }}
        path: |
          Library/TeamTalk_DLL/${{ matrix.abi }}/libTeamTalk5.so
          Library/TeamTalk_DLL/${{ matrix.abi }}/libTeamTalk5-jni.so

    - name: Upload TeamTalk5.jar Artifact
      uses: actions/upload-artifact@v4
      if: success() && matrix.abi == 'arm64-v8a'
      with:
        name: TeamTalk5-jar
        path: Library/TeamTalkJNI/TeamTalk5.jar

    - name: Save Cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: |
          Library/TeamTalkLib/toolchain
          Build
        key: ${{ runner.os }}-android-${{ matrix.abi }}-toolchain-${{ hashFiles('Library/TeamTalkLib/toolchain/**/CMakeLists.txt', 'Library/TeamTalkLib/toolchain/**/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
